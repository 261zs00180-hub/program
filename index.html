<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- BootstrapのCSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">

  <!-- 自分で作成したCSS -->
  <link rel="stylesheet" href="program.css">

  <title>今日の気分判定診断</title>
</head>

<body class="bg-primary-subtle">

<header>
  <nav class="navbar bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">今日の気分判定診断</a>
    </div>
  </nav>
</header>

<h1>今日の気分判定診断</h1>

<div class="question card text-start p-3 mb-4">

<h2>① 現在の気分は？</h2>

<div><label><input type="radio" name="mood" value="元気"> 元気</label></div>
<div><label><input type="radio" name="mood" value="楽しい"> 楽しい</label></div>
<div><label><input type="radio" name="mood" value="落ち着いている"> 落ち着いている</label></div>
<div><label><input type="radio" name="mood" value="普通"> 普通</label></div>
<div><label><input type="radio" name="mood" value="疲れている"> 疲れている</label></div>
<div><label><input type="radio" name="mood" value="悲しい"> 悲しい</label></div>
<div><label><input type="radio" name="mood" value="イライラしている"> イライラしている</label></div>
<div><label><input type="radio" name="mood" value="不安"> 不安</label></div>

</div>

<div class="card text-start p-3 mb-4">

<h2>② 今の自分に近い状態は？</h2>

<div><label><input type="radio" name="state" value="挑戦"> 新しいことに挑戦したい</label></div>
<div><label><input type="radio" name="state" value="集中"> 集中したい</label></div>
<div><label><input type="radio" name="state" value="会話"> 誰かと話したい</label></div>
<div><label><input type="radio" name="state" value="一人"> 一人で過ごしたい</label></div>
<div><label><input type="radio" name="state" value="活動"> 積極的に活動したい</label></div>
<div><label><input type="radio" name="state" value="休息"> 何もしたくない</label></div>
<div><label><input type="radio" name="state" value="リラックス"> リラックスしたい</label></div>
<div><label><input type="radio" name="state" value="気分転換"> 気分転換したい</label></div>

</div>

<button id="assessment">診断する</button>
<div id="result-area"></div>

<script src="program.js"></script>
</body>
</html>
